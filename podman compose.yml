services:
  image: postgres:18.7
  container_name: rr_space__postgres
  environment:
    POSTGRES_USER: ${DB_USER}
    POSTGRES_PASSWORD: ${DB_PASSWORD}
    POSTGRES_DB: ${DB_NAME}
  ports:
    - "5432:5432"
  volumes:
    - pgdata:/var/lib/postgresql/data
  healthcheck:
    test: [ "CMD-SHELL", "pg_isready -U ${DB_USER}" ]
    interval: 5s
    timeout: 3s
    retries: 5

  redis:
    image: redis:8.10.3
    container_name: rr_space_redis
    ports:
      - "6379:6379"
    depends_on:
      - postgres
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: always

  backend:
    build:
      context: ./backend
      dockerfile: Containerfile
    container_name: rr_space__backend
    volumes:
      - ./backend:/app
    ports:
      - "8080:8080"
    command: go run main.go
    environment:
      - PORT=8080
      - REDIS_HOST=redis
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    restart: always

volumes:
  pgdata: