services:
  redis:
    image: redis:8.10.3
    container_name: studio_now_redis
    ports:
      - "6379:6379"
    restart: always

  backend:
    build:
      context: ./backend
      dockerfile: Containerfile
    container_name: studio_now__backend
    volumes:
      - ./backend:/app
    ports:
      - "8080:8080"
    command: go run main.go
    environment:
      - PORT=8080
      - REDIS_HOST=redis
    depends_on:
      - redis
    restart: always
