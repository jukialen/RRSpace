services:
  postgres:
    image: postgres:17
    container_name: rr_space__postgres
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT}:${DB_PORT}"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER}" ]
      interval: 5s
      timeout: 3s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:9.19.0
    container_name: rr_space__pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${UI_DB_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${UI_DB_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: ${UI_DB_SERVER_MODE}
    ports:
      - "5050:80"
    depends_on:
      - postgres
    restart: always

  redis:
    image: redis:8.10.3
    container_name: rr_space_redis
    ports:
      - "${REDIS_PORT}:${REDIS_PORT}"
    depends_on:
      - postgres
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: always

  backend:
    build:
      context: ./backend
      dockerfile: Containerfile
    container_name: rr_space__backend
    volumes:
      - ./backend:/app
    ports:
      - "${BC_PORT}:${BC_PORT}"
    command: sh -c "go mod tidy && go run cmd/api/main.go"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-development}
      BC_PORT: ${BC_PORT}
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      APPWRITE_REGION: ${APPWRITE_REGION}
      APPWRITE_PROJECT_ID: ${APPWRITE_PROJECT_ID}
      APPWRITE_API_KEY: ${APPWRITE_API_KEY}
      R2_ENDPOINT: ${R2_ENDPOINT}
      R2_BUCKET: ${R2_BUCKET}
      R2_ACCESS_KEY: ${R2_ACCESS_KEY}
      R2_SECRET_KEY: ${R2_SECRET_KEY}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID}
      JWT_SECRET: ${JWT_SECRET}
    restart: always

volumes:
  pgdata:
  